<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1ede4">
  <title>OAIP Battles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@700&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>

  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>OAIP Battles</h1>
      </div>
      <a id="repo-link" class="repo-link" href="https://github.com/Study-Dump/OAIP-Battles-IEF" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <div class="toolbar">
    <label class="battle-select">
      <span>Баттл</span>
      <select id="battle-select" aria-label="Выбор баттла">
        <option>…</option>
      </select>
    </label>
    <button type="button" id="clear-btn" class="btn danger">Очистить историю</button>
  </div>

  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button type="button" role="tab" id="tab-battle" class="tab active" aria-selected="true" aria-controls="panel-battle" data-tab="battle">Баттл</button>
    <button type="button" role="tab" id="tab-matrix" class="tab" aria-selected="false" aria-controls="panel-matrix" data-tab="matrix">Краш-матрица</button>
    <button type="button" role="tab" id="tab-history" class="tab" aria-selected="false" aria-controls="panel-history" data-tab="history">История</button>
  </nav>

  <main id="main">
    <section id="panel-battle" class="panel active" role="tabpanel" aria-labelledby="tab-battle"></section>
    <section id="panel-matrix" class="panel" role="tabpanel" aria-labelledby="tab-matrix"></section>
    <section id="panel-history" class="panel" role="tabpanel" aria-labelledby="tab-history"></section>
  </main>

  <noscript>
    <p class="noscript">Нужен JavaScript.</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
