<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a0e">
  <title>OAIP Battles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>

  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
            <line x1="13" x2="19" y1="19" y2="13"></line>
            <line x1="16" x2="20" y1="16" y2="20"></line>
            <line x1="19" x2="21" y1="21" y2="19"></line>
            <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"></polyline>
            <line x1="5" x2="9" y1="14" y2="18"></line>
            <line x1="7" x2="4" y1="17" y2="20"></line>
            <line x1="3" x2="5" y1="19" y2="21"></line>
          </svg>
        </span>
        <h1>OAIP Battles</h1>
      </div>
      <a id="repo-link" class="repo-link" href="https://github.com/Study-Dump/OAIP-Battles-IEF" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <div class="toolbar">
    <label class="battle-select">
      <span>Баттл</span>
      <select id="battle-select" aria-label="Выбор баттла">
        <option>…</option>
      </select>
    </label>
    <button type="button" id="clear-btn" class="btn danger">Очистить историю</button>
  </div>

  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button type="button" role="tab" id="tab-battle" class="tab active" aria-selected="true" aria-controls="panel-battle" data-tab="battle">Баттл</button>
    <button type="button" role="tab" id="tab-matrix" class="tab" aria-selected="false" aria-controls="panel-matrix" data-tab="matrix">Краш-матрица</button>
    <button type="button" role="tab" id="tab-history" class="tab" aria-selected="false" aria-controls="panel-history" data-tab="history">История</button>
  </nav>

  <main id="main">
    <section id="panel-battle" class="panel active" role="tabpanel" aria-labelledby="tab-battle"></section>
    <section id="panel-matrix" class="panel" role="tabpanel" aria-labelledby="tab-matrix"></section>
    <section id="panel-history" class="panel" role="tabpanel" aria-labelledby="tab-history"></section>
  </main>

  <noscript>
    <p class="noscript">Нужен JavaScript.</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
