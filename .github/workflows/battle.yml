name: Battle

on:
  push:
    branches: ['vs/*']

permissions:
  contents: read

concurrency:
  group: battles
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse vs/A-B
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          if [[ ! "$branch" =~ ^vs/([1-5])-([1-5])$ ]]; then
            echo "::error::Branch must be named vs/A-B with A,B in 1..5 (got: $branch)"
            exit 1
          fi
          a="${BASH_REMATCH[1]}"
          b="${BASH_REMATCH[2]}"
          if [[ "$a" == "$b" ]]; then
            echo "::error::Team cannot fight itself: $branch"
            exit 1
          fi
          {
            echo "TEAM_A=$a"
            echo "TEAM_B=$b"
          } >> "$GITHUB_ENV"
          echo "Battle: team$a vs team$b"

      - name: Compile solutions
        run: |
          set -euo pipefail
          g++ -O2 -std=c++17 -o "$RUNNER_TEMP/sol_a" "teams/team${TEAM_A}/solution.cpp"
          g++ -O2 -std=c++17 -o "$RUNNER_TEMP/sol_b" "teams/team${TEAM_B}/solution.cpp"

      - name: Run tests for team A
        run: |
          python3 scripts/runner.py \
            --solution "$RUNNER_TEMP/sol_a" \
            --tests-dir "tests/team${TEAM_A}" \
            --author-prefix "0${TEAM_B}" \
            --team "$TEAM_A" --opponent "$TEAM_B" \
            --out "$RUNNER_TEMP/partial_a.json"

      - name: Run tests for team B
        run: |
          python3 scripts/runner.py \
            --solution "$RUNNER_TEMP/sol_b" \
            --tests-dir "tests/team${TEAM_B}" \
            --author-prefix "0${TEAM_A}" \
            --team "$TEAM_B" --opponent "$TEAM_A" \
            --out "$RUNNER_TEMP/partial_b.json"

      - name: Merge results
        run: |
          python3 scripts/merge_results.py \
            --a "$RUNNER_TEMP/partial_a.json" \
            --b "$RUNNER_TEMP/partial_b.json" \
            --battle "vs/${TEAM_A}-${TEAM_B}" \
            --out site/results.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: battle-result
          path: site/results.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RESULTS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: battle-result
          path: ${{ runner.temp }}/battle-result

      - name: Append result to history and push
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          artifact = os.path.join(os.environ["RUNNER_TEMP"], "battle-result", "results.json")
          with open(artifact, encoding="utf-8") as f:
              entry = json.load(f)
          if not entry.get("id"):
              raise SystemExit("empty battle result")

          with open("site/history.json", encoding="utf-8") as f:
              history = json.load(f)
          if not isinstance(history.get("battles"), list):
              history = {"battles": []}

          if not any(b.get("id") == entry["id"] for b in history["battles"]):
              history["battles"].append(entry)

          with open("site/results.json", "w", encoding="utf-8") as f:
              json.dump(entry, f, indent=2, ensure_ascii=False)
          with open("site/history.json", "w", encoding="utf-8") as f:
              json.dump(history, f, indent=2, ensure_ascii=False)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"BATTLE={entry['battle']}\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/results.json site/history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "battle: ${BATTLE} [skip ci]"
          git push origin HEAD:main
