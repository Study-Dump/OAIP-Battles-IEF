name: Clear History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clear-history
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reset site JSON
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          with open("site/results.json", "w", encoding="utf-8") as f:
              json.dump({}, f, indent=2)
          with open("site/history.json", "w", encoding="utf-8") as f:
              json.dump({"battles": []}, f, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/results.json site/history.json
          if git diff --cached --quiet; then
            echo "History is already empty"
            exit 0
          fi
          git commit -m "clear history [skip ci]"
          git push
